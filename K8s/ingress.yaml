apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tron
  namespace: tron
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket support: long-lived connections must not be reaped by nginx.
    nginx.ingress.kubernetes.io/websocket-services: "tron-server"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tron.kodloki.io
      secretName: tron-tls
  rules:
    - host: tron.kodloki.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tron-server
                port:
                  number: 3000
